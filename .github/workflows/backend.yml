name: GB Date Filters PHP

on: [workflow_dispatch, push, pull_request]

jobs:
  run:
    uses: flarum/framework/.github/workflows/REUSABLE_backend.yml@2.x
    with:
      enable_backend_testing: true
      enable_phpstan: true
      php_versions: '["8.3", "8.4"]'

      backend_directory: .

    secrets:
      composer_auth: '{"http-basic": {"repo.packagist.com": {"username": "token", "password": "${{secrets.PRIVATE_PACKAGIST_TOKEN}}"}}}'
